<?xml version="1.0"?>
<def format="2">
  <!-- The builtin model preserves assertion operands but models TEST_F as a
       free function. Real GoogleTest executes its body as a derived-fixture
       member; preserve that scope so inherited state is analyzed. -->
  <define name="TEST_F(Fixture,Name)" value="class Fixture ## _ ## Name ## _Test : public Fixture { public: void TestBody(); }; void Fixture ## _ ## Name ## _Test::TestBody()"/>
</def>
