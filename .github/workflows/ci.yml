name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
        mode: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S src/linkerta -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=${{ matrix.mode }}
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 60
  sanitizer:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ['address,undefined', 'thread']
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S src/linkerta -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 90
  ros2:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y python3-colcon-common-extensions ros-humble-sensor-msgs ros-humble-diagnostic-msgs ros-humble-std-srvs ros-humble-launch-testing-ament-cmake libgtest-dev libgmock-dev
      - shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select linkerta --cmake-args -DUSE_ROS2=ON -DBUILD_TESTING=ON
          colcon test --packages-select linkerta --return-code-on-test-failure
          colcon test-result --verbose

  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: find src -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror

  installed-dependency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: soulteary/linkerbot-transport-cpp
          ref: e514b832e09ecd60a56d2c67e39c54285793fff8
          path: build-dependency-src
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - name: Build and install the pinned transport package
        run: |
          cmake -S build-dependency-src -B build-dependency \
            -DCMAKE_BUILD_TYPE=Release \
            -DLINKERBOT_COMM_BUILD_TESTS=OFF \
            -DLINKERBOT_COMM_BUILD_EXAMPLES=OFF \
            -DLINKERBOT_COMM_BUILD_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/transport-install"
          cmake --build build-dependency --parallel 2
          cmake --install build-dependency
      - name: Build and test the driver without dependency downloads
        run: |
          cmake -S src/linkerta -B build-installed \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/transport-install" \
            -DLINKERTA_ALLOW_DEPENDENCY_DOWNLOADS=OFF \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          cmake --build build-installed --parallel 2
          ctest --test-dir build-installed --output-on-failure --no-tests=error --timeout 60

  vcan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated virtual CAN interface
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan-test type vcan
          sudo ip link set vcan-test up
      - run: cmake -S src/linkerta -B build-vcan -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DLINKERTA_TEST_VCAN_INTERFACE=vcan-test
      - run: cmake --build build-vcan --parallel 2
      - run: ctest --test-dir build-vcan --output-on-failure --no-tests=error --timeout 60
      - if: always()
        run: sudo ip link delete vcan-test || true

  synthetic-benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S src/linkerta -B build-bench -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DLINKERTA_BUILD_BENCHMARKS=ON
      - run: cmake --build build-bench --parallel 2
      - run: ctest --test-dir build-bench --output-on-failure --no-tests=error --timeout 90
      - name: Record explicitly synthetic baseline
        run: ./build-bench/linkerta_benchmark --simulate --count 100 --rate-hz 20 --timeout-ms 250 --output synthetic.csv
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-baseline-${{ matrix.os }}
          path: |
            synthetic.csv
            synthetic.csv.metadata.json
